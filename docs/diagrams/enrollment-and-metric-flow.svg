<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 680" role="img" aria-labelledby="title desc">
  <title id="title">Enrollment and disk metric flow</title>
  <desc id="desc">A sequence showing account discovery, role assumption, tagged instance discovery, Ansible configuration over SSM, local disk metric publishing, centralized dashboards and alarms, and notification.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#526079}.step{font-size:14px;font-weight:700}.copy{font-size:13px;fill:#34445d}.lane{font-size:14px;font-weight:700;fill:#526079}.node{stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa}.green{fill:#f0fdf4;stroke:#4ade80}.purple{fill:#f5f3ff;stroke:#a78bfa}.orange{fill:#fff7ed;stroke:#fb923c}
    </style>
  </defs>
  <rect width="1500" height="680" fill="#ffffff"/>
  <text x="48" y="50" class="title">Enrollment and metric flow</text>
  <text x="48" y="78" class="sub">Ansible performs enrollment and configuration. The CloudWatch Agent sends telemetry continuously afterward.</text>
  <rect x="42" y="116" width="1416" height="220" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="42" y="362" width="1416" height="250" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="64" y="148" class="lane">CONTROL PLANE · enrollment and configuration</text>
  <text x="64" y="394" class="lane">DATA PLANE · continuous metrics and response</text>

  <rect x="72" y="183" width="210" height="106" rx="12" class="node blue"/>
  <text x="90" y="213" class="step">1 · Discover</text><text x="90" y="239" class="copy">Organizations accounts</text><text x="90" y="261" class="copy">and enabled Regions</text>
  <rect x="330" y="183" width="210" height="106" rx="12" class="node blue"/>
  <text x="348" y="213" class="step">2 · Assume role</text><text x="348" y="239" class="copy">STS session with</text><text x="348" y="261" class="copy">external ID trust</text>
  <rect x="588" y="183" width="210" height="106" rx="12" class="node blue"/>
  <text x="606" y="213" class="step">3 · Find instances</text><text x="606" y="239" class="copy">Running EC2 tagged</text><text x="606" y="261" class="copy">DiskMonitoring=enabled</text>
  <rect x="846" y="183" width="210" height="106" rx="12" class="node blue"/>
  <text x="864" y="213" class="step">4 · Publish and configure</text><text x="864" y="239" class="copy">Ansible publishes the config;</text><text x="864" y="261" class="copy">State Manager enrolls new tags</text>
  <rect x="1104" y="183" width="302" height="106" rx="12" class="node orange"/>
  <text x="1122" y="213" class="step">5 · Validate enrollment</text><text x="1122" y="239" class="copy">Check agent service, config,</text><text x="1122" y="261" class="copy">and fresh metric datapoints</text>

  <path d="M282 236 H330" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M540 236 H588" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M798 236 H846" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1056 236 H1104" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="72" y="442" width="240" height="112" rx="12" class="node green"/>
  <text x="90" y="474" class="step">6 · Read filesystem</text><text x="90" y="502" class="copy">CloudWatch Agent collects</text><text x="90" y="524" class="copy">disk_used_percent every 5 min</text>
  <rect x="360" y="442" width="240" height="112" rx="12" class="node green"/>
  <text x="378" y="474" class="step">7 · Publish metric</text><text x="378" y="502" class="copy">CWAgent namespace in</text><text x="378" y="524" class="copy">source account and Region</text>
  <rect x="648" y="442" width="240" height="112" rx="12" class="node purple"/>
  <text x="666" y="474" class="step">8 · Share with OAM</text><text x="666" y="502" class="copy">Regional source link to</text><text x="666" y="524" class="copy">central monitoring account</text>
  <rect x="936" y="442" width="240" height="112" rx="12" class="node purple"/>
  <text x="954" y="474" class="step">9 · Observe</text><text x="954" y="502" class="copy">Dashboards and alarms;</text><text x="954" y="524" class="copy">coverage gaps tracked too</text>
  <rect x="1224" y="442" width="182" height="112" rx="12" class="node orange"/>
  <text x="1242" y="474" class="step">10 · Respond</text><text x="1242" y="502" class="copy">SNS notification</text><text x="1242" y="524" class="copy">to operators</text>
  <path d="M312 498 H360" stroke="#15803d" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M600 498 H648" stroke="#15803d" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M888 498 H936" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1176 498 H1224" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow)"/>

  <path d="M1208 289 V345 H192 V442" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="625" y="337" class="copy">After setup, metric collection continues independently of Ansible availability.</text>
</svg>
